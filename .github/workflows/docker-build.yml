name: Docker Build & Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/laravel-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, bcmath, dom, curl
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        run: php artisan test

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for services to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/up >/dev/null && curl -fs http://localhost:8080/health >/dev/null; then
              echo "Services are up"; exit 0
            fi
            sleep 5
          done
          echo "Services did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"title":"CI smoke test"}' http://localhost:8080/tasks
          curl -fsS http://localhost:8080/tasks | grep -q "CI smoke test"
          curl -fsS http://localhost:8000/go-tasks | grep -q "CI smoke test"

      - name: Tear down
        if: always()
        run: docker compose down -v
